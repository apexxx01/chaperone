<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" font-family="Geist, Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff3b30"/></marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4f4f4"/></marker>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1c1c1c"/></pattern>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#0a0a0a"/><line x1="0" y1="0" x2="0" y2="6" stroke="#2c2c2c" stroke-width="2"/></pattern>
  </defs>
  <rect width="1280" height="700" fill="#000"/>
  <rect width="1280" height="700" fill="url(#dots)"/>

  <text x="48" y="58" font-size="13" fill="#6a6a6a" letter-spacing="1.5" font-family="Geist Mono, ui-monospace, Menlo, monospace">HOW CHAPERONE WORKS</text>
  <text x="48" y="96" font-size="30" font-weight="600" fill="#f4f4f4" letter-spacing="-0.8">The agent proposes. The gate checks. PayPal holds. You release.</text>

  <!-- 1 You -->
  <g>
    <rect x="48" y="150" width="190" height="150" rx="12" fill="#0a0a0a" stroke="#2c2c2c"/>
    <text x="68" y="180" font-size="12" fill="#6a6a6a" font-family="Geist Mono, ui-monospace, Menlo, monospace">01 · YOU</text>
    <text x="68" y="208" font-size="16" font-weight="600" fill="#f4f4f4">Sign limits once</text>
    <text x="68" y="234" font-size="13" fill="#a1a1a1">Gemini drafts limits</text>
    <text x="68" y="252" font-size="13" fill="#a1a1a1">from your words; you</text>
    <text x="68" y="270" font-size="13" fill="#a1a1a1">approve in PayPal</text>
    <text x="68" y="288" font-size="12" fill="#6a6a6a" font-family="Geist Mono, ui-monospace, Menlo, monospace">Vault v3</text>
  </g>
  <line x1="238" y1="225" x2="276" y2="225" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 2 Agent -->
  <g>
    <rect x="280" y="150" width="190" height="150" rx="12" fill="#0a0a0a" stroke="#2c2c2c"/>
    <text x="300" y="180" font-size="12" fill="#6a6a6a" font-family="Geist Mono, ui-monospace, Menlo, monospace">02 · ANY AGENT</text>
    <text x="300" y="208" font-size="16" font-weight="600" fill="#f4f4f4">Shops, proposes</text>
    <text x="300" y="234" font-size="13" fill="#a1a1a1">search · view · buy</text>
    <text x="300" y="252" font-size="13" fill="#a1a1a1">Gemini (Nova backup),</text>
    <text x="300" y="270" font-size="13" fill="#a1a1a1">or yours over MCP</text>
    <text x="300" y="288" font-size="12" fill="#6a6a6a" font-family="Geist Mono, ui-monospace, Menlo, monospace">Channel3 search</text>
  </g>
  <line x1="470" y1="225" x2="508" y2="225" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 3 The gate -->
  <g>
    <rect x="512" y="130" width="400" height="300" rx="16" fill="#0a0a0a" stroke="#f4f4f4" stroke-width="1.5"/>
    <text x="536" y="162" font-size="12" fill="#6a6a6a" font-family="Geist Mono, ui-monospace, Menlo, monospace">03 · THE GATE (about 1 s)</text>
    <text x="536" y="190" font-size="17" font-weight="600" fill="#f4f4f4">Every purchase, five layers</text>

    <rect x="536" y="206" width="352" height="38" rx="8" fill="#111" stroke="#2c2c2c"/>
    <text x="552" y="230" font-size="13" fill="#f4f4f4" font-weight="600">Signed limits</text>
    <text x="872" y="230" font-size="12" fill="#a1a1a1" text-anchor="end">plain code: budget, qty, specs</text>

    <rect x="536" y="250" width="352" height="38" rx="8" fill="#111" stroke="#2c2c2c"/>
    <text x="552" y="274" font-size="13" fill="#f4f4f4" font-weight="600">Channel3 catalog truth</text>
    <text x="872" y="274" font-size="12" fill="#a1a1a1" text-anchor="end">real seller, price, 90 days</text>

    <rect x="536" y="294" width="352" height="38" rx="8" fill="#111" stroke="#2c2c2c"/>
    <text x="552" y="318" font-size="13" fill="#f4f4f4" font-weight="600">Injection scanner</text>
    <text x="872" y="318" font-size="12" fill="#a1a1a1" text-anchor="end">hidden Unicode, fake system text</text>

    <rect x="536" y="338" width="172" height="74" rx="8" fill="url(#hatch)" stroke="#2c2c2c"/>
    <text x="552" y="362" font-size="13" fill="#f4f4f4" font-weight="600">Quarantined reader</text>
    <text x="552" y="382" font-size="12" fill="#a1a1a1">reads the page,</text>
    <text x="552" y="399" font-size="12" fill="#a1a1a1">answers yes/no only</text>

    <rect x="716" y="338" width="172" height="74" rx="8" fill="url(#hatch)" stroke="#2c2c2c"/>
    <text x="732" y="362" font-size="13" fill="#f4f4f4" font-weight="600">Privileged auditor</text>
    <text x="732" y="382" font-size="12" fill="#a1a1a1">your words + facts,</text>
    <text x="732" y="399" font-size="12" fill="#a1a1a1">never sees the page</text>
  </g>

  <!-- decisions -->
  <line x1="712" y1="430" x2="712" y2="486" stroke="#ff3b30" stroke-width="1.5" marker-end="url(#r)"/>
  <rect x="580" y="490" width="264" height="44" rx="10" fill="none" stroke="#ff3b30" stroke-dasharray="4 4"/>
  <text x="712" y="517" font-size="13" fill="#ff3b30" text-anchor="middle" font-weight="600">fail → blocked, PayPal never called</text>
  <text x="712" y="560" font-size="12" fill="#a1a1a1" text-anchor="middle">warn → held for your one tap</text>
  <text x="712" y="580" font-size="12" fill="#6a6a6a" text-anchor="middle">blocked? Channel3 offers the real seller instead</text>

  <line x1="912" y1="225" x2="950" y2="225" stroke="#f4f4f4" stroke-width="1.5" marker-end="url(#w)"/>
  <text x="931" y="214" font-size="11" fill="#a1a1a1" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace">pass</text>

  <!-- 4 PayPal holds -->
  <g>
    <rect x="954" y="150" width="278" height="120" rx="12" fill="#f4f4f4"/>
    <text x="974" y="180" font-size="12" fill="#525252" font-family="Geist Mono, ui-monospace, Menlo, monospace">04 · PAYPAL HOLDS THE MONEY</text>
    <text x="974" y="210" font-size="17" font-weight="600" fill="#0a0a0a">Authorized, not captured</text>
    <text x="974" y="236" font-size="13" fill="#3a3a3a">Orders v2 intent=AUTHORIZE</text>
    <text x="974" y="256" font-size="13" fill="#3a3a3a">with the vaulted wallet</text>
  </g>
  <line x1="1093" y1="270" x2="1093" y2="306" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 5 Delivery -->
  <g>
    <rect x="954" y="310" width="278" height="282" rx="12" fill="#0a0a0a" stroke="#2c2c2c"/>
    <text x="974" y="340" font-size="12" fill="#6a6a6a" font-family="Geist Mono, ui-monospace, Menlo, monospace">05 · ONLY YOUR WORD RELEASES IT</text>
    <text x="974" y="368" font-size="16" font-weight="600" fill="#f4f4f4">Arrival vs your order</text>
    <text x="974" y="390" font-size="12" fill="#a1a1a1">photo checked by Gemini vision</text>

    <text x="974" y="424" font-size="13" fill="#f4f4f4" font-weight="600">match</text>
    <text x="1212" y="424" font-size="12" fill="#a1a1a1" text-anchor="end">capture · tracking · Payouts</text>
    <line x1="974" y1="436" x2="1212" y2="436" stroke="#1c1c1c"/>
    <text x="974" y="460" font-size="13" fill="#f4f4f4" font-weight="600">short shipment</text>
    <text x="1212" y="460" font-size="12" fill="#a1a1a1" text-anchor="end">final partial capture</text>
    <line x1="974" y1="472" x2="1212" y2="472" stroke="#1c1c1c"/>
    <text x="974" y="496" font-size="13" fill="#ff3b30" font-weight="600">wrong item</text>
    <text x="1212" y="496" font-size="12" fill="#a1a1a1" text-anchor="end">void: money never moved</text>
    <line x1="974" y1="508" x2="1212" y2="508" stroke="#1c1c1c"/>
    <text x="974" y="532" font-size="13" fill="#f4f4f4" font-weight="600">later problem</text>
    <text x="1212" y="532" font-size="12" fill="#a1a1a1" text-anchor="end">capture refund</text>
    <line x1="974" y1="544" x2="1212" y2="544" stroke="#1c1c1c"/>
    <text x="974" y="568" font-size="12" fill="#6a6a6a">a seller's own "delivered" releases nothing</text>
  </g>

  <!-- bottom strip -->
  <rect x="48" y="618" width="1184" height="50" rx="12" fill="#0a0a0a" stroke="#2c2c2c"/>
  <text x="70" y="648" font-size="13" fill="#f4f4f4" font-weight="600">Two keys.</text>
  <text x="146" y="648" font-size="13" fill="#a1a1a1">The agent's key can search, propose and read. Approve, deliver, refund or sign → <tspan fill="#ff3b30" font-weight="600">403</tspan>.</text>
  <text x="1212" y="648" font-size="12" fill="#6a6a6a" text-anchor="end" font-family="Geist Mono, ui-monospace, Menlo, monospace">every call streamed live · hash-chained receipts</text>

  <!-- left lower: evidence -->
  <g>
    <rect x="48" y="330" width="422" height="262" rx="12" fill="#0a0a0a" stroke="#2c2c2c"/>
    <text x="68" y="360" font-size="12" fill="#6a6a6a" font-family="Geist Mono, ui-monospace, Menlo, monospace">MEASURED IN THE PAYPAL SANDBOX</text>
    <text x="68" y="404" font-size="34" font-weight="600" fill="#ff3b30" letter-spacing="-1">−$1,398.13</text>
    <text x="68" y="426" font-size="12" fill="#a1a1a1">agent alone, if it falls for all 21 attacks</text>
    <text x="300" y="404" font-size="34" font-weight="600" fill="#f4f4f4" letter-spacing="-1">$0.00</text>
    <text x="300" y="426" font-size="12" fill="#a1a1a1">through Chaperone</text>
    <line x1="68" y1="448" x2="450" y2="448" stroke="#1c1c1c"/>
    <text x="68" y="476" font-size="13" fill="#f4f4f4"><tspan font-weight="600">19 / 1 / 0</tspan><tspan fill="#a1a1a1">  blocked / held / past the gate, on 20 attacks</tspan></text>
    <text x="68" y="496" font-size="13" fill="#a1a1a1">  a separate model invented after the gate was built</text>
    <text x="68" y="526" font-size="13" fill="#f4f4f4"><tspan font-weight="600">4 of 18</tspan><tspan fill="#a1a1a1">  attacks fooled a live Gemini agent on its own</tspan></text>
    <text x="68" y="556" font-size="13" fill="#f4f4f4"><tspan font-weight="600">4 of 4</tspan><tspan fill="#a1a1a1">  honest purchases went through</tspan></text>
    <text x="68" y="578" font-size="11" fill="#6a6a6a" font-family="Geist Mono, ui-monospace, Menlo, monospace">raw reports: docs/receipts/</text>
  </g>
</svg>
